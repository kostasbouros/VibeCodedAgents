[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "g4s-telematix-agents"
version = "0.1.0"
description = "Small AI agents for G4S Telematix that share connectors and utilities."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic",
    "httpx",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "pyyaml",
    "tenacity",
    "structlog",
    "pandas",
    "fastapi",
    "uvicorn",
    "typer",
    "jinja2",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "respx",
    "ruff",
    "mypy",
]

[tool.setuptools.packages.find]
include = ["shared*", "connectors*", "agents*", "mock_api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
